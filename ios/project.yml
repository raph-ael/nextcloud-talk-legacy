# XcodeGen spec – generate the Xcode project with `xcodegen generate` (in ios/).
# The Rust core must be built first: `scripts/build-core.sh` (creates Generated/).
#
# Forks: change the bundle id / display name below.
name: TalkLegacy

options:
  bundleIdPrefix: org.sirplus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TalkLegacy:
    type: application
    platform: iOS
    sources:
      - path: TalkApp
      - path: Generated/talk_ffi.swift
        group: Generated
    dependencies:
      - framework: Generated/TalkCoreFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    info:
      path: TalkApp/Info.plist
      properties:
        CFBundleDisplayName: Sirplus Talk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Only standard HTTPS/TLS → exempt from export compliance documentation.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sirplus.talk
        PRODUCT_NAME: TalkLegacy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

schemes:
  TalkLegacy:
    build:
      targets:
        TalkLegacy: all
    run:
      config: Debug
    archive:
      config: Release
