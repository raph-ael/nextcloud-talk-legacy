# XcodeGen spec – generate the Xcode project with `xcodegen generate` (in ios/).
# The Rust core must be built first: `scripts/build-core.sh` (creates Generated/).
#
# Forks: change the bundle id / display name below. Device builds take the Apple team
# from the environment: DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
# Pushes (calls while the app is closed) need the push proxy's URL the same way:
# TALK_PUSH_PROXY_URL=https://push.example.org xcodegen generate
name: TalkLegacy

options:
  bundleIdPrefix: org.wolkenfunk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

packages:
  # libwebrtc (Google WebRTC M157) – the build has an x86_64 simulator slice (Intel Macs).
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "300"
    VERSIONING_SYSTEM: apple-generic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # Push proxy (push-proxy/), from the environment when generating: empty = no push.
    TALK_PUSH_PROXY_URL: ${TALK_PUSH_PROXY_URL}
    CODE_SIGN_STYLE: Automatic

targets:
  TalkLegacy:
    type: application
    platform: iOS
    sources:
      - path: TalkApp
      - path: Generated/talk_ffi.swift
        group: Generated
    dependencies:
      - framework: Generated/TalkCoreFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - package: WebRTC
      - sdk: CallKit.framework
      - sdk: PushKit.framework
      - target: TalkNotify
    # Written by xcodegen (the file is generated). aps-environment: development for Debug,
    # production for Release (APS_ENVIRONMENT). The first keychain group stays the app's
    # default (the account); the shared one holds the push key for TalkNotify.
    entitlements:
      path: TalkApp/TalkLegacy.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.wolkenfunk.app
          - $(AppIdentifierPrefix)org.wolkenfunk.app.shared
    info:
      path: TalkApp/Info.plist
      properties:
        CFBundleDisplayName: Wolkenfunk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Landscape only while a shared screen is shown in a call (AppDelegate).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Only standard HTTPS/TLS → exempt from export compliance documentation.
        ITSAppUsesNonExemptEncryption: false
        TalkPushProxyURL: $(TALK_PUSH_PROXY_URL)
        # Shared with TalkNotify: the push device key.
        TalkKeychainGroup: $(AppIdentifierPrefix)org.wolkenfunk.app.shared
        NSMicrophoneUsageDescription: Für Anrufe und zum Aufnehmen von Sprachnachrichten.
        NSCameraUsageDescription: Zum Aufnehmen und Senden von Fotos und für Videoanrufe.
        NSPhotoLibraryUsageDescription: Zum Senden von Fotos aus deiner Mediathek.
        # audio: voice messages keep playing with the screen locked, calls keep their audio;
        # voip: incoming calls via PushKit; processing: the outbox finishes sending after
        # the app was left.
        UIBackgroundModes:
          - audio
          - voip
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - org.wolkenfunk.app.outbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wolkenfunk.app
        PRODUCT_NAME: TalkLegacy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  # Notification Service Extension: decrypts chat pushes with the core.
  TalkNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: NotifyExt
      - path: TalkApp/Core/PushKey.swift
      - path: Generated/talk_ffi.swift
        group: Generated
    dependencies:
      - framework: Generated/TalkCoreFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    entitlements:
      path: NotifyExt/TalkNotify.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.wolkenfunk.app.shared
    info:
      path: NotifyExt/Info.plist
      properties:
        CFBundleDisplayName: Wolkenfunk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TalkKeychainGroup: $(AppIdentifierPrefix)org.wolkenfunk.app.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wolkenfunk.app.notify
        PRODUCT_NAME: TalkNotify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  TalkLegacyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TalkLegacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wolkenfunk.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TalkLegacy

schemes:
  TalkLegacy:
    build:
      targets:
        TalkLegacy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TalkLegacyUITests
    archive:
      config: Release
