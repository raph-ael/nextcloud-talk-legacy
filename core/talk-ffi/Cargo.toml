[package]
name = "talk-ffi"
description = "UniFFI bindings (Kotlin/Swift) for talk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "talk_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter", "std"] }
talk-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi = { version = "0.32", features = ["tokio", "cli"] }
