[workspace]
resolver = "3"
members = ["talk-core", "talk-ffi", "talk-node", "talk-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
talk-core = { path = "talk-core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "cookies", "query", "form", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1.29", features = ["v4"] }
sha2 = "0.11"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
# Push: per-device RSA key (Nextcloud push v2), decrypting notification subjects.
rsa = "0.9"
sha1 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
# Signaling / notify_push websockets over reqwest's HTTP/1.1 upgrade (same TLS setup as the API).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Voice messages: MP3 encoding (LAME, LGPL) and decoding for duration/waveform (MPL-2.0).
mp3lame-encoder = "0.3"
# Group pictures: decode, crop to a square, encode JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# Smaller dev builds: full debug info only for our own crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
