[package]
name = "talk-node"
description = "Node-API (napi-rs) bindings of talk-core for the Electron desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
talk-core.workspace = true
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
napi-build = "2"
