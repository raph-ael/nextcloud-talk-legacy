[package]
name = "talk-cli"
description = "Debug/test CLI for the Talk core against a real Nextcloud server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "talk-cli"
path = "src/main.rs"

[dependencies]
talk-core.workspace = true
tokio.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
