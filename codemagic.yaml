# Codemagic CI/CD – https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
#
# Signing uses Codemagic's automatic code signing: an App Store Connect API key added under
# Settings → Integrations → Developer Portal (its name goes into `integrations` below) and an
# Apple Distribution certificate under Settings → Code signing identities. Codemagic creates
# the provisioning profile for BUNDLE_ID itself; no secrets live in this file or the repo.
#
# Trigger: push a tag like `ios-v0.1.0`, or start the workflow manually.

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic iOS
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.sirplus.talk
      vars:
        BUNDLE_ID: "org.sirplus.talk"
        XCODE_PROJECT: "ios/TalkLegacy.xcodeproj"
        XCODE_SCHEME: "TalkLegacy"
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $CM_BUILD_DIR/core/target

    scripts:
      - name: Install Rust toolchain
        script: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"

      - name: Build Rust core (xcframework + Swift bindings)
        script: |
          SLICES=device ios/scripts/build-core.sh

      - name: Generate Xcode project
        script: |
          command -v xcodegen >/dev/null || brew install xcodegen
          # Signing settings come from use-profiles below; an empty team keeps the spec valid.
          cd ios && DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM:-}" xcodegen generate

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - raphael.wintrich@mailbox.org
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
