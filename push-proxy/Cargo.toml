[package]
name = "talk-push-proxy"
description = "Push proxy for the Nextcloud push v2 protocol: forwards encrypted notifications to FCM and APNs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.8"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
hex = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
form_urlencoded = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = "symbols"
