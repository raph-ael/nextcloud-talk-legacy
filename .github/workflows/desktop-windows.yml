# Windows build of the desktop app: NSIS installer (per user, no admin) plus latest.yml for
# electron-updater. Signed with Azure Artifact Signing when the repository variable WIN_SIGN
# is 1 (see docs/release.md, "Windows signieren"); otherwise unsigned, and SmartScreen shows
# "Unbekannter Herausgeber".
# desktop/scripts/release-windows.sh downloads the artifact of the run for tag v<version>.
name: Desktop Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, package.json $v" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # aws-lc (rustls) needs NASM for its assembly on Windows; CMake is on the runner.
      - uses: ilammy/setup-nasm@v1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Core (talk_node.dll → native/talk_node.node)
        run: PROFILE=release scripts/build-core.sh

      - run: npx electron-vite build

      # electron-builder signs the app, the uninstaller and the installer itself, before it writes
      # the blockmap and latest.yml, so their checksums fit the signed installer. A failed
      # signature fails the build: no unsigned installer leaves a run that should sign.
      # The secrets reach this step only.
      - name: Installer
        env:
          WIN_SIGN: ${{ vars.WIN_SIGN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WIN_SIGN_ENDPOINT: ${{ secrets.WIN_SIGN_ENDPOINT }}
          WIN_SIGN_ACCOUNT: ${{ secrets.WIN_SIGN_ACCOUNT }}
          WIN_SIGN_PROFILE: ${{ secrets.WIN_SIGN_PROFILE }}
          WIN_SIGN_PUBLISHER: ${{ secrets.WIN_SIGN_PUBLISHER }}
        run: |
          if [ "$WIN_SIGN" = 1 ]; then
            npx electron-builder --win --publish never --config scripts/win-sign-config.cjs
          else
            echo "WIN_SIGN is not 1: unsigned build"
            npx electron-builder --win --publish never
          fi

      # App and installer carry a valid, timestamped signature (the certificates live only a few
      # days, the timestamp keeps the signature valid) in the name the app expects of its updates.
      - name: Signature
        if: vars.WIN_SIGN == '1'
        shell: pwsh
        env:
          WIN_SIGN_PUBLISHER: ${{ secrets.WIN_SIGN_PUBLISHER }}
        run: |
          $files = @(Get-Item dist/win-unpacked/Wolkenfunk.exe) + @(Get-ChildItem dist -Filter 'Wolkenfunk-Setup-*.exe')
          if ($files.Count -lt 2) { throw 'installer not found' }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name): signature is $($s.Status)" }
            if (-not $s.TimeStamperCertificate) { throw "$($f.Name): no timestamp" }
            if ($s.SignerCertificate.GetNameInfo('SimpleName', $false) -cne $env:WIN_SIGN_PUBLISHER) { throw "$($f.Name): signed with another name" }
            "$($f.Name): signed and timestamped"
          }
          # Every program and library the app ships, our own core included, is signed.
          $inner = Get-ChildItem dist/win-unpacked -Recurse -File -Include *.exe, *.dll, *.node
          foreach ($f in $inner) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name): signature is $($s.Status)" }
          }
          "$($inner.Count) programs and libraries in the app: all signed"
          # The installed app accepts the installer as an update (it compares the signer's name).
          $setup = Get-ChildItem dist -Filter 'Wolkenfunk-Setup-*.exe' | Where-Object { $_.Name -notlike '*uninstaller*' } | Select-Object -First 1
          node scripts/win-verify-update.cjs dist/win-unpacked/resources/app-update.yml $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'the updater would refuse this installer' }

      # The unpacked app starts and stays up: the main process loads native/talk_node.node at
      # startup, so its window (seen through the DevTools port) only exists if that worked.
      - name: Smoke test
        run: |
          app=dist/win-unpacked/Wolkenfunk.exe
          [ -f "$app" ] || { echo "missing $app" >&2; exit 1; }
          "$app" --user-data-dir="$RUNNER_TEMP/smoke-profile" --remote-debugging-port=9333 &
          ok=
          for i in $(seq 60); do
            sleep 1
            if curl -s -m 2 localhost:9333/json/list | grep -q 'out/renderer/index.html'; then ok=1; break; fi
          done
          [ -n "$ok" ] || { echo "no app window after 60 s" >&2; taskkill //F //IM Wolkenfunk.exe //T || true; exit 1; }
          sleep 10
          curl -s -m 2 localhost:9333/json/list | grep -q 'out/renderer/index.html' || { echo "app gone after start" >&2; exit 1; }
          echo "app window up after ${i}s and still there 10 s later"
          taskkill //F //IM Wolkenfunk.exe //T || true

      - uses: actions/upload-artifact@v4
        with:
          name: wolkenfunk-windows
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
